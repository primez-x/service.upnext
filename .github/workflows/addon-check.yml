name: Kodi
on:
- pull_request
- push
permissions:
  contents: read
jobs:
  tests:
    name: Add-on checker (${{ matrix.kodi-branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kodi-branch: [matrix, omega]
    steps:
    - name: Check out source
      uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install kodi-addon-checker
    - name: Export add-on package
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/package/service.upnext"
        git archive HEAD | tar -x -C "$RUNNER_TEMP/package/service.upnext"
    - name: Run kodi-addon-checker
      run: kodi-addon-checker --branch=${{ matrix.kodi-branch }} "$RUNNER_TEMP/package/service.upnext/"
