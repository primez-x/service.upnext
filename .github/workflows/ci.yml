name: CI
on:
- pull_request
- push
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    env:
      PYTHONIOENCODING: utf-8
      PYTHONPATH: ${{ github.workspace }}/resources/lib:${{ github.workspace }}/tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11', '3.12']
    steps:
    - name: Check out source
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Run flake8
      run: python -m tox -q -e flake8
    - name: Run pylint
      run: python -m pylint resources/lib/
    - name: Compare translations
      run: |
        for translation in resources/language/resource.language.*/strings.po; do
          if [[ "$translation" != resources/language/resource.language.en_gb/strings.po ]]; then
            msgcmp --use-untranslated "$translation" resources/language/resource.language.en_gb/strings.po
          fi
        done
    - name: Run pytest
      run: python -m pytest --log-cli-level=INFO
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: coverage-python-${{ matrix.python-version }}
        path: coverage.xml
        if-no-files-found: error
